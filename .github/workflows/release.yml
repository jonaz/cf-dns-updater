name: release

# A v* tag builds the linux binaries and publishes them, with SHA256SUMS, as
# a GitHub release. The build is reproducible: the same Go, flags and commit
# give the same bytes, so anyone can rebuild a tag and
# check it against SHA256SUMS.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          cache: false # nothing from an earlier run goes into a release
      - name: test
        run: go mod verify && go vet ./... && go test ./...
      - name: build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X main.version=$TAG" -o "dist/cf-dns-updater-linux-$arch" .
          done
          (cd dist && sha256sum cf-dns-updater-linux-* > SHA256SUMS && cat SHA256SUMS)
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes
